name: Build Android APK (Docker)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with kivy/buildozer Docker
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            -e JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 \
            -e PATH=/usr/lib/jvm/java-11-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            kivy/buildozer:latest \
            bash -lc 'apt-get update && apt-get install -y openjdk-11-jdk && export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64 && export PATH=$JAVA_HOME/bin:$PATH && javac -version && buildozer android debug'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autoaccount-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30