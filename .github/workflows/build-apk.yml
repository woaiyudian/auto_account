name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          echo "=== Installing system dependencies ==="
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev liblzma-dev \
            patch ccache autoconf-archive libtool-bin
          echo "=== Verifying package installation ==="
          which autoconf || echo "autoconf not found"
          which libtool || echo "libtool not found"
          which autoreconf || echo "autoreconf not found"
          dpkg -l | grep -E "autoconf-archive|libtool-bin" || echo "Packages not installed"
          java -version

      - name: Clean previous build artifacts
        if: always()
        run: |
          echo "=== Cleaning previous build ==="
          rm -rf .buildozer
          mkdir -p .buildozer

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython virtualenv

      - name: Cache buildozer / SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build Android debug
        run: |
          # GitHub Actions 默认 JAVA_HOME 指向 Java 25，python-for-android 不支持，切到 Java 11
          export JAVA_HOME=$JAVA_HOME_11_X64
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "=== Verifying buildozer installation ==="
          which buildozer || echo "buildozer not found"
          echo "=== Starting build process ==="
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          BUILDOZER_EXIT=${PIPESTATUS[0]}
          echo "buildozer exit code: $BUILDOZER_EXIT"
          echo "=== build.log (full output) ==="
          cat build.log
          ls -lh bin/ 2>/dev/null || echo "bin/ not found yet"
          test $BUILDOZER_EXIT -eq 0

      - name: Debug dist directory
        if: always()
        run: |
          echo "=== .buildozer tree ==="
          find .buildozer -maxdepth 4 -type d 2>/dev/null | head -50
          echo "=== AndroidManifest.xml locations ==="
          find .buildozer -name AndroidManifest.xml 2>/dev/null
          echo "=== bin/ ==="
          ls -lh bin/ 2>/dev/null || echo "bin/ not found"

      - name: Patch accessibility + notification services into the package
        run: |
          python3 scripts/patch_android.py
          DIST=$(ls -d "$PWD"/.buildozer/android/platform/build-*/dists/*/ | head -1)
          echo "dist = $DIST"
          cd "$DIST"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          cd "$GITHUB_WORKSPACE"
          mkdir -p bin
          find .buildozer -path '*/outputs/apk/release/*.apk' -exec cp -v {} bin/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autoaccount-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 30