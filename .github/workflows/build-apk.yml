name: Build Android APK (Docker)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect buildozer image
        run: |
          docker pull kivy/buildozer:latest
          docker inspect --format 'Entrypoint={{.Config.Entrypoint}} Cmd={{.Config.Cmd}} User={{.Config.User}} WorkDir={{.Config.WorkingDir}}' kivy/buildozer:latest

      - name: Build APK
        run: |
          docker run --rm --user 0:0 \
            --entrypoint /bin/bash \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            -c 'set -e
                echo "=== java ==="; java -version || true
                echo "=== buildozer ==="; buildozer --version
                echo "=== build start ==="
                buildozer -v android debug'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autoaccount-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
