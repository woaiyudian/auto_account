name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool \
            libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev liblzma-dev \
            patch ccache
          java -version

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython>=3.0" buildozer virtualenv
          buildozer --version

      - name: Prepare patched python-for-android
        run: |
          rm -rf p4a-local
          git clone --depth 1 -b master https://github.com/kivy/python-for-android.git p4a-local
          python scripts/patch_p4a.py \
            p4a-local/pythonforandroid/build.py \
            p4a-local/pythonforandroid/bootstraps/_sdl_common/build/templates/AndroidManifest.tmpl.xml \
            android/res/extra_application.xml

      - name: Ensure SDK platform 34
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cache buildozer / SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK
        run: |
          set -o pipefail
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          # 清掉上一轮缓存的旧分发，强制按打过补丁的清单模板重新生成引导，
          # 但保留 build/ 下已编译好的原生依赖，避免整包重编。
          rm -rf .buildozer/android/platform/build-*/dists
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoaccount-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 30
